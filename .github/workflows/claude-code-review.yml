# Claude reviews every PR (open + each push). Cross-family check on the
# factory's GPT-built diffs; auth draws on the Claude subscription via a
# long-lived OAuth token: run `claude setup-token` locally, then
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN --body "<token>"
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # same-repo PRs only: fork PRs receive no secrets, so the job would
    # fail red on every external contribution. Dependabot-triggered runs
    # are the same class despite being same-repo (Actions secrets
    # withheld, read-only token) — gate on the run's actor, not the PR
    # author, so a human pushing to a dependabot branch still gets a
    # review (that run carries normal secrets)
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # The checkout above is PR-CONTROLLED, and claude-code-action loads
      # project hooks from .claude/settings.json and MCP servers from
      # .mcp.json out of the workspace. Both execute shell OUTSIDE
      # --allowedTools, so without this a PR that edits either file runs
      # arbitrary code with CLAUDE_CODE_OAUTH_TOKEN in its environment before
      # any tool policy applies. The same-repo guard above does not cover it:
      # it excludes forks, but factory branches are same-repo and agent-authored.
      # The review needs neither file — prompt and tool permissions come from
      # this workflow. CLAUDE.md stays: it shapes the prompt and cannot execute.
      - name: Drop PR-controlled agent configuration
        run: rm -rf .claude .mcp.json
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR for correctness bugs, security issues, and missing
            or weak test coverage. Read the surrounding code before judging a
            hunk, and post inline comments on the specific lines where you
            find real issues — concrete failure scenarios only, no style
            nits, no speculative "consider" suggestions. Finish with one
            summary comment: either the issues found ranked by severity, or a
            clean verdict naming what you checked.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
