# Claude reviews every PR (open + each push). Cross-family check on the
# factory's GPT-built diffs; auth draws on the Claude subscription via a
# long-lived OAuth token: run `claude setup-token` locally, then
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN --body "<token>"
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # same-repo PRs only: fork PRs receive no secrets, so the job would
    # fail red on every external contribution. Dependabot-triggered runs
    # are the same class despite being same-repo (Actions secrets
    # withheld, read-only token) — gate on the run's actor, not the PR
    # author, so a human pushing to a dependabot branch still gets a
    # review (that run carries normal secrets)
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Everything checked out above is PR-CONTROLLED, and two separate
      # surfaces make that dangerous while CLAUDE_CODE_OAUTH_TOKEN is in the
      # action's environment.
      #
      # 1. CODE EXECUTION. claude-code-action loads project hooks from
      #    .claude/settings.json and MCP servers from .mcp.json out of the
      #    workspace, and both execute shell OUTSIDE --allowedTools. There is
      #    no trusted counterpart worth restoring, so drop them outright.
      #
      # 2. PROMPT INJECTION INTO AN ALLOWED TOOL. CLAUDE.md and AGENTS.md are
      #    instruction files the reviewer reads. They cannot execute, but they
      #    do not need to: --allowedTools permits `Bash(gh pr comment:*)`, and
      #    `gh pr comment --body-file <path>` reads its body from any file the
      #    runner can read. PR-authored instructions can therefore direct the
      #    reviewer to post /proc/self/environ — disclosing the long-lived
      #    OAuth token through a permitted tool. Restore the base branch's
      #    copies instead of trusting the PR's.
      #
      # The same-repo guard above does not cover any of this: it excludes
      # forks, but factory branches are same-repo and agent-authored.
      #
      # Fail closed. If the base cannot be fetched the instruction files stay
      # absent rather than falling back to the PR's versions; the review's
      # prompt and tool permissions come from this workflow regardless.
      - name: Replace PR-controlled agent configuration with the base branch's
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rm -rf .claude .mcp.json
          rm -f CLAUDE.md AGENTS.md
          if git fetch --depth 1 origin "$BASE_SHA" 2>/dev/null; then
            git checkout "$BASE_SHA" -- CLAUDE.md 2>/dev/null || true
            git checkout "$BASE_SHA" -- AGENTS.md 2>/dev/null || true
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR for correctness bugs, security issues, and missing
            or weak test coverage. Read the surrounding code before judging a
            hunk, and post inline comments on the specific lines where you
            find real issues — concrete failure scenarios only, no style
            nits, no speculative "consider" suggestions. Finish with one
            summary comment: either the issues found ranked by severity, or a
            clean verdict naming what you checked.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
